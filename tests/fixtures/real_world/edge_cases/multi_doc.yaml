---
apiVersion: v1
kind: Service
metadata:
  name: multi-svc
spec:
  ports:
  - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multi
  template:
    metadata:
      labels:
        app: multi
    spec:
      containers:
      - name: multi
        image: multi:1.0.0
        resources:
          requests:
            cpu: 100m
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: multi-cfg
data:
  ENV: prod
